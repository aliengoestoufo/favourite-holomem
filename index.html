<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Favourite Hololive Members</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Unbounded:wght@500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=Flavors&family=Hachi+Maru+Pop&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="https://file.garden/aI8-BqCdkxABOmJv/hololive.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="blob-field"></div>

<nav class="pill-nav">
  <div class="pill-nav-glass">
    <div class="pill-nav-inner" id="navPills"></div>
  </div>
</nav>

<header>
  <h1>Hololive Members</h1>
  <p>Every generation and unit, all in one place. Use the nav above to jump around, or click any card to open a profile.</p>
  <p class="katakana">ホロライブ</p>
</header>

<main>
  <div id="content"></div>
</main>

<footer>Made with love for oshi everywhere · replace the dashed boxes with your own images</footer>

<button class="back-to-top" id="backToTop" aria-label="Back to top">
  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
</button>

<div class="nav-zone left" id="zoneLeft">
  <button class="nav-arrow" id="prevArrow" aria-label="Previous member">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
  </button>
</div>
<div class="nav-zone right" id="zoneRight">
  <button class="nav-arrow" id="nextArrow" aria-label="Next member">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
  </button>
</div>

<div class="backdrop" id="backdrop">
  <div class="panel" id="panel" style="--card-accent:#0ea5a4;">
    <button class="close-btn" id="closeBtn" aria-label="Close">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
    <div class="panel-media">
      <div class="fullbody-placeholder" id="fullbodyPlaceholder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"></path></svg>
        <span id="mediaLabel">Full body image goes here</span>
      </div>
      <div class="thumb-row" id="thumbRow"></div>
    </div>
    <div class="panel-info">
      <div class="panel-tag" id="panelTag">Generation</div>
      <div class="panel-name" id="panelName">Name</div>
      <p class="panel-desc" id="panelDesc"></p>
    </div>
  </div>
</div>

<script src="script.js"></script>

</body>
</html>
